[package]
name = "dimos-virtual-mid360"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "virtual_mid360"
path = "src/main.rs"

[dependencies]
# Direct dependencies of the copied livox wire/pipeline/pcap modules. See src/main.rs.
crc = "3"
etherparse = "0.21.0"
pcap-parser = "0.17.0"
dimos-module = { path = "../../../../../native/rust/dimos-module" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
serde = { version = "1", features = ["derive"] }
socket2 = "0.6"
tracing = "0.1"
validator = { version = "0.21", features = ["derive"] }

# The copied livox pcap.rs tests write a temp pcap. Copying the module meant
# copying its test dependency too.
[dev-dependencies]
tempfile = "3"

[workspace]

# Carried from the old root workspace. Cargo only honours a profile at the workspace
# root, so every module that is now its own root has to state it.
[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev]
debug = 0

[profile.test]
debug = 0
