[package]
name = "dimos-module-macros"
version = "0.1.0"
edition = "2021"
description = "Proc-macros for dimos-module"
license = "Apache-2.0"

# Its own workspace root, not a member of one. `native/rust` is copied into every
# module's build sandbox crate-by-crate, where no parent workspace manifest exists,
# so anything else would resolve differently locally than it does in the build.
[workspace]

[lib]
proc-macro = true

[dependencies]
syn = { version = "3", features = ["full"] }
quote = "1"
proc-macro2 = "1"
# `#[module(name = ...)]` reads the crate's own Cargo.toml to check the ports it
# declares against `[package.metadata.dimos.module.*]`, the index `dimos bake` reads.
toml = "1.1"
