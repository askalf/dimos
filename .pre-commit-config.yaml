default_stages: [pre-commit]
default_install_hook_types: [pre-commit, commit-msg]
exclude: (dimos/models/.*)|(deprecated)
repos:

  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.5
    hooks:
      - id: insert-license
        files: \.py$
        exclude: (__init__\.py$)|(dimos/rxpy_backpressure/)
        args:
          # use if you want to remove licences from all files
          # (for globally changing wording or something)
          #- --remove-header
          - --license-filepath
          - assets/license_file_header.txt
          - --use-current-year
      - id: insert-license
        name: insert-license (rust)
        files: \.rs$
        types: [rust]
        args:
          - --license-filepath
          - assets/license_file_header.txt
          - --comment-style
          - "//"
          - --use-current-year

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.3
    hooks:
      - id: ruff-format
        stages: [pre-commit]
      - id: ruff-check
        args: [--fix, --unsafe-fixes]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-case-conflict
      # These three rewrite bytes, so they are kept off files that must stay
      # byte-identical to something outside this repo: upstream patches.
      - id: trailing-whitespace
        language: python
        types: [text]
        exclude: &verbatim-files (\.patch$)
      - id: end-of-file-fixer
        exclude: *verbatim-files
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: *verbatim-files
      - id: check-json
        exclude: ^misc/DimSim/public/sims/  # LFS-tracked
      - id: check-toml
      - id: check-yaml
        # mkdocs-material configures extensions with !!python/name: tags,
        # which pyyaml's safe loader refuses to construct.
        exclude: ^mkdocs\.yml$
      - id: pretty-format-json
        name: format json
        args: [ --autofix, --no-sort-keys ]
        # misc/DimSim/public/sims/ is LFS-tracked; web/ JSON is owned by `deno fmt`
        exclude: ^(misc/DimSim/public/sims/|web/)

  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: 3.4.1
    hooks:
      - id: editorconfig-checker
        alias: ec
        args: [-disable-max-line-length, -disable-indentation]

  # - repo: local
  #   hooks:
  #     - id: mypy
  #       name: Type check
  #       # possible to also run within the dev image
  #       #entry: "./bin/dev mypy"
  #       entry: "./bin/mypy"
  #       language: python
  #       additional_dependencies: ["mypy==1.15.0", "numpy>=1.26.4,<2.0.0"]
  #       types: [python]

  - repo: local
    hooks:
      - id: uv-lock-check
        name: Check uv.lock is up-to-date
        entry: uv lock --check
        language: system
        files: ^pyproject\.toml$
        pass_filenames: false

      - id: lfs_check
        name: LFS data
        always_run: true
        pass_filenames: false
        entry: bin/hooks/lfs_check
        language: script

      - id: largefiles-check
        name: Large files check
        always_run: true
        pass_filenames: false
        entry: python bin/hooks/largefiles_check
        args: [--all]
        language: python
        additional_dependencies: ['tomli']

      - id: emdash-check
        name: No em dashes in docs
        entry: bin/hooks/emdash_check
        language: script
        files: ^docs/.*\.mdx?$
        exclude: ^docs/node_modules/

      - id: doclinks
        name: Doclinks
        always_run: true
        pass_filenames: false
        entry: python -m dimos.cli.doclinks docs/
        language: system
        files: ^docs/.*\.md$
        exclude: ^docs/node_modules/

      - id: filter-commit-message
        name: Filter generated signatures from commit message
        entry: python bin/hooks/filter_commit_message.py
        language: python
        stages: [commit-msg]

      - id: check-commit-message
        name: Check commit messages for generated signatures
        always_run: true
        pass_filenames: false
        entry: python bin/hooks/filter_commit_message.py --check
        language: python
        stages: [pre-commit]

      # Every rust crate now lives in its own cargo workspace with its own flake, so
      # both hooks walk the workspace roots and enter each one's own devShell. There
      # is no repo-root fallback: a repo-root flake ref would copy the entire tree,
      # git-lfs blobs and all, into the store on every commit.
      - id: cargo-fmt
        name: cargo fmt
        entry: |
          bash -c '
            set -euo pipefail
            top=$(git rev-parse --show-toplevel)
            system=$(nix eval --raw --impure --expr builtins.currentSystem)
            git ls-files "*Cargo.toml" | while read -r m; do
              cargo locate-project --manifest-path "$m" --workspace --message-format plain
            done | sort -u | while read -r root; do
              dir=$(dirname "$root")
              while [ "$dir" != "$top" ] && [ ! -f "$dir/flake.nix" ]; do dir=$(dirname "$dir"); done
              if [ "$dir" = "$top" ]; then
                echo "no module flake above $root -- refusing to fall back to the repo-root" >&2
                echo "flake, which would copy the whole tree (git-lfs blobs included)." >&2
                exit 1
              fi
              # A module may declare it does not support this platform: realsense links
              # librealsense, which pulls v4l-utils, which nixpkgs will not evaluate off
              # Linux. Such a module has no devShell here and cannot be linted here
              # either, so skip it rather than block the commit. CI lints on Linux,
              # where the devShell does exist.
              if ! nix eval --quiet "path:$dir#devShells.$system.default.outPath" >/dev/null 2>&1; then
                echo "skipping $root: $dir declares no devShell for $system" >&2
                continue
              fi
              nix develop "path:$dir" -c cargo fmt --manifest-path "$root" --all
            done
          '
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: |
          bash -c '
            set -euo pipefail
            top=$(git rev-parse --show-toplevel)
            system=$(nix eval --raw --impure --expr builtins.currentSystem)
            git ls-files "*Cargo.toml" | while read -r m; do
              cargo locate-project --manifest-path "$m" --workspace --message-format plain
            done | sort -u | while read -r root; do
              dir=$(dirname "$root")
              while [ "$dir" != "$top" ] && [ ! -f "$dir/flake.nix" ]; do dir=$(dirname "$dir"); done
              if [ "$dir" = "$top" ]; then
                echo "no module flake above $root -- refusing to fall back to the repo-root" >&2
                echo "flake, which would copy the whole tree (git-lfs blobs included)." >&2
                exit 1
              fi
              # A module may declare it does not support this platform: realsense links
              # librealsense, which pulls v4l-utils, which nixpkgs will not evaluate off
              # Linux. Such a module has no devShell here and cannot be linted here
              # either, so skip it rather than block the commit. CI lints on Linux,
              # where the devShell does exist.
              if ! nix eval --quiet "path:$dir#devShells.$system.default.outPath" >/dev/null 2>&1; then
                echo "skipping $root: $dir declares no devShell for $system" >&2
                continue
              fi
              nix develop "path:$dir" -c cargo clippy --manifest-path "$root" --workspace --all-targets -- -D warnings
            done
          '
        language: system
        types: [rust]
        pass_filenames: false

      - id: deno-fmt
        name: deno fmt (web/)
        entry: bash -c 'cd web && deno fmt'
        language: system
        files: ^web/
        pass_filenames: false
