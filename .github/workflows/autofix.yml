name: autofix.ci
on:
  pull_request:

permissions: {}

jobs:
  lint:
    timeout-minutes: 1
    runs-on: ubuntu-latest
    permissions:
      contents: read  # For checkout
    env:
      UV_NO_SYNC: "1"  # Disable installing default packages on `uv run`

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          prune-cache: true
          cache-suffix: autofix
      - name: Install dependencies
        run: uv sync --only-group autofix --frozen
      - name: Ruff fix
        run: uv run ruff check --fix-only --unsafe-fixes
      - name: Ruff format
        run: uv run ruff format
      - name: uv lock
        run: uv lock

      - name: autofix.ci
        uses: autofix-ci/action@v1

  relock-shared-flakes:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read  # For checkout

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Did native/{rust,cpp} change?
        id: shared
        run: |
          set -euo pipefail
          base=${{ github.event.pull_request.base.sha }}
          if git diff --quiet "$base"...HEAD -- native/rust native/cpp; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Nix
        if: steps.shared.outputs.changed == 'true'
        run: bash docker/ros/install-nix.sh
      - name: Relock the modules onto this revision
        if: steps.shared.outputs.changed == 'true'
        run: python3 bin/relock-shared-flakes
      - name: autofix.ci
        if: steps.shared.outputs.changed == 'true'
        uses: autofix-ci/action@v1
